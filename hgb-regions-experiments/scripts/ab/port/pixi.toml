# Private env for machines without the benchmarks repo.
[workspace]
name = "hgb-regions"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.13.*"
pip = "*"
cython = "3.2.5.*"
numpy = "*"
scipy = "*"
meson-python = "*"
ninja = "*"
joblib = "*"
threadpoolctl = "*"
narwhals = "*"
pandas = "*"
pyarrow = "*"
pytest = "*"
tabulate = "*"
tqdm = "*"
psutil = "*"
requests = "*"
py-cpuinfo = "*"
pydantic = "*"
fastparquet = "*"

# conda-forge only solves an old openml that needs distutils.
[pypi-dependencies]
openml = ">=0.15.1"

[target.linux-64.dependencies]
gcc = "*"
gxx = "*"

[target.osx-arm64.dependencies]
clang = "*"
clangxx = "*"
libcxx-devel = "*"
llvm-openmp = "*"
