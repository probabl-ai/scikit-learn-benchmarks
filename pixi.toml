[workspace]
name = "scikit-learn-benchmarks"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
numpy = "*"
scipy = "*"
pandas = "<3"
ipykernel = "*"
tabulate = "*"
fastparquet = "*"
h5py = "*"
openpyxl = "*"
tqdm = "*"
psutil = "*"
requests = "*"
py-cpuinfo = "*"

[pypi-dependencies]
openml = ">=0.15.1"

[feature.sklearn.dependencies]
scikit-learn = "*"

[feature.intel.dependencies]
scikit-learn = "*"
scikit-learn-intelex = "*"
setuptools = "<82"

[feature.intel.activation.env]
SCIPY_ARRAY_API = "1"

[feature.intel.pypi-dependencies]
dpnp = "*"
triton-xpu = { version = "==3.7.1", index = "https://download.pytorch.org/whl/xpu" }
torch = { version = ">=2.12.0", index = "https://download.pytorch.org/whl/xpu" }

[feature.nightly.pypi-dependencies]
scikit-learn = { version = "*", index = "https://pypi.anaconda.org/scientific-python-nightly-wheels/simple" }

[feature.sklearn-src.dependencies]
pip = "*"
setuptools = "<82"
wheel = "*"
ninja = "*"
pytest = ">=7.1.2"
pytest-cov = ">=2.9.0"
numpy = ">=2"
scipy = ">=1.10.0"
cython = ">=3.1.2"
meson-python = ">=0.17.1"
joblib = ">=1.3.0"
threadpoolctl = ">=3.2.0"
narwhals = ">=2.0.1"

[feature.sklearn-src.tasks]
install-sklearn-src = "cd ../scikit-learn && pip install --editable . --verbose --no-build-isolation --config-settings editable-verbose=true"

[environments]
sklearn = ["sklearn"]
nightly = ["nightly"]
sklearn-src = ["sklearn-src"]
intel = ["intel"]
