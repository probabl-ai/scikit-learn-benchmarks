[workspace]
name = "scikit-learn-benchmarks"
channels = ["conda-forge"]
requires-pixi = ">=0.75"
# Merged over pixi's default conda-forge mapping. Patches entries it gets
# wrong: prefix.dev maps the free-threaded numpy build (used by
# sklearn-dev-freethreading) to no PyPI package, so pixi would install a
# second, PyPI numpy over it.
conda-pypi-map = { "conda-forge" = "conda-pypi-map.json" }
platforms = [
    "linux-64",
    "osx-arm64",
    "win-64",
    { name = "linux-64-cuda-12-9", platform = "linux-64", cuda = "12.9" },
]

[dependencies]
# No `python` pin here: pixi intersects a dependency's specs across features
# rather than letting one override another, so a pin in [dependencies] would
# block a single environment from moving to another Python. Every environment
# instead picks one from `py314` or `py314t`.
ipykernel = "*"
tabulate = "*"
tqdm = "*"
psutil = "*"
requests = "*"
py-cpuinfo = "*"
pydantic = "*"
pytest = "*"

[pypi-dependencies]
# `dpctl` is not here: it only ships manylinux x86_64 wheels, so pinning it
# for every environment would block non-Linux platforms. It's only actually
# used (with graceful ImportError fallback - see sklbench/config/utils.py and
# sklbench/orchestrator/env.py) for Intel GPU/oneAPI detection, so it's
# declared directly in the `intel`/`skl-intel` features instead, the only
# ones where it's needed (it's also a transitive `dpnp` dependency there).
scikit-learn-benchmarks = { path = ".", editable = true }
openml = ">=0.15.1"
nvidia-ml-py = "*"
py-spy = "*"

[feature.py314.dependencies]
python = "3.14.*"

[feature.py314t]
# ipykernel has no free-threaded conda-forge build for win-64.
platforms = ["linux-64", "osx-arm64"]

[feature.py314t.dependencies]
# Free-threaded ("3.14t") CPython build.
python = { version = "3.14.*", build = "*_cp314t" }

[feature.py314t.activation.env]
# pandas<3's `pandas._libs.pandas_parser` doesn't declare free-threading
# support, so importing pandas silently re-enables the GIL for the whole
# process. Benchmarks only call pandas from the main thread.
PYTHON_GIL = "0"

[feature.sklearn-pypi.pypi-dependencies]
scikit-learn = "==1.9.*"
# Vanilla `pip install scikit-learn` also pulls numpy/scipy/pandas as PyPI
# wheels (bundled OpenBLAS), not conda-forge builds - keep this environment
# on the same wheels so it reflects what most users actually run. fastparquet/
# h5py/matplotlib have to come from PyPI here too: their conda-forge builds
# link against conda numpy, which would drag conda numpy/pandas back in as a
# transitive conda dependency and defeat the point.
numpy = "*"
scipy = "*"
pandas = "<3"
fastparquet = "*"
h5py = "*"
matplotlib = "*"

[feature.numpy-conda.dependencies]
# numpy/scipy/pandas, plus the conda packages that transitively require
# conda-built numpy/pandas (fastparquet, h5py, matplotlib), for every
# conda-forge-built scikit-learn environment. Kept out of the base
# [dependencies] so `sklearn-pypi` (and the Array API environments layered
# on it) can source all of these from PyPI instead - see
# feature.sklearn-pypi.pypi-dependencies above.
numpy = "*"
scipy = "*"
pandas = "<3"
fastparquet = "*"
h5py = "*"
matplotlib = "*"

[feature.sklearn-conda.dependencies]
scikit-learn = "1.9.*"

[feature.sklearn-openblas-pthreads.dependencies]
libblas = { version = "*", build = "*_openblas" }
liblapack = { version = "*", build = "*_openblas" }
libopenblas = { version = "*", build = "*pthreads*" }
scikit-learn = "1.9.*"

[feature.sklearn-openblas-openmp.dependencies]
libblas = { version = "*", build = "*_openblas" }
liblapack = { version = "*", build = "*_openblas" }
libopenblas = { version = "*", build = "*openmp*" }
scikit-learn = "1.9.*"

[feature.sklearn-openblas-pthreads-kmp-llvm]
# The libgomp->libomp compat symlink build below is Linux-only (see the
# dependency comment); macOS already links OpenMP against libomp directly,
# so this redirect doesn't apply there.
platforms = ["linux-64"]

[feature.sklearn-openblas-pthreads-kmp-llvm.dependencies]
# `_openmp_mutex=*_kmp_llvm` ships a `libgomp.so.1 -> libomp.so` compat
# symlink, so sklearn's libgomp-linked OpenMP calls get transparently
# serviced by the LLVM/Intel runtime instead - the same mechanism MKL builds
# use (see sklbench/orchestrator/env.py) - while OpenBLAS itself stays on
# plain pthreads threading (no OpenMP in BLAS).
_openmp_mutex = { version = "*", build = "*_kmp_llvm" }

[feature.sklearn-mkl]
platforms = ["linux-64"]

[feature.sklearn-mkl.dependencies]
libblas = { version = "*", build = "*mkl*" }
liblapack = { version = "*", build = "*mkl*" }
mkl = "*"
scikit-learn = "1.9.*"

[feature.sklearn-dev.dependencies]
cython = "*"
meson-python = "*"
ninja = "*"
pip = "*"
pkg-config = "*"
threadpoolctl = "*"
c-compiler = "*"
cxx-compiler = "*"

[feature.sklearn-dev.pypi-dependencies]
# Points at the checkout scripts/setup_sklearn_ref.sh manages. Run that
# script before installing this environment; it reuses this path across
# refs via `git checkout --detach`, so pixi keeps resolving this editable
# source instead of a versioned wheel and won't clobber it back on later
# `pixi run` invocations (unlike the transitive scikit-learn pulled in
# elsewhere via openml).
scikit-learn = { path = "sklearn-src", editable = true }

[feature.sklearn-dev.pypi-options]
# Build scikit-learn against this environment's own cython/meson-python/ninja
# instead of a throwaway build-isolation venv: meson-python's editable loader
# reruns ninja on every import, and it keeps pointing at the isolated venv's
# (since-deleted) toolchain if the build isn't isolated to begin with.
no-build-isolation = ["scikit-learn"]

[feature.sklearn-dev-libomp]
# Same Linux-only reasoning as `sklearn-openblas-pthreads-kmp-llvm` above.
platforms = ["linux-64"]

[feature.sklearn-dev-libomp.dependencies]
# Same `_openmp_mutex=*_kmp_llvm` redirect as
# `sklearn-openblas-pthreads-kmp-llvm` above: it ships a
# `libgomp.so.1 -> libomp.so` compat symlink, so this dev build's
# libgomp-linked OpenMP calls (sklearn's own Cython parallel loops, compiled
# by the `c-compiler`/`cxx-compiler` from `sklearn-dev` above) get serviced by
# the LLVM/Intel `libomp` runtime instead - without changing which sklearn
# source is built or which BLAS it links against.
_openmp_mutex = { version = "*", build = "*_kmp_llvm" }

[feature.sklearn-dev-mkl]
# conda-forge's mkl is linux-64 only here (same as `sklearn-mkl`).
platforms = ["linux-64"]

[feature.sklearn-dev-mkl.dependencies]
# Same BLAS switch as `sklearn-mkl`: numpy/scipy from numpy-conda dispatch
# to MKL through the libblas/liblapack metapackages. mkl pulls in
# `_openmp_mutex=*_llvm`, so sklearn's own OpenMP loops also run on libomp.
libblas = { version = "*", build = "*mkl*" }
liblapack = { version = "*", build = "*mkl*" }
mkl = "*"

[feature.sklearn-dev-freethreading.dependencies]
# Same packages as feature.numpy-conda, minus fastparquet (below): pixi can't
# drop a dependency a feature brings in, so this environment doesn't use
# numpy-conda at all.
numpy = "*"
scipy = "*"
pandas = "<3"
h5py = "*"
matplotlib = "*"

[feature.sklearn-dev-freethreading.pypi-dependencies]
# conda-forge has no free-threaded fastparquet build, PyPI has cp314t wheels.
fastparquet = "*"

[feature.intel]
# scikit-learn-intelex-gpu and the oneAPI stack it pulls in are Linux-only.
platforms = ["linux-64"]

[feature.intel.dependencies]
scikit-learn = "1.8.*"
setuptools = "<82"

[feature.intel.pypi-dependencies]
array-api-compat = "*"
dpctl = "*"
dpnp = "*"
scikit-learn-intelex-gpu = "*"

[feature.intel.activation.env]
SCIPY_ARRAY_API = "1"

[feature.skl-nvidia]
channels = ["conda-forge", "nvidia"]
platforms = ["linux-64-cuda-12-9"]

[feature.skl-nvidia.dependencies]
cuda-version = "12.9.*"
cupy = "*"

[feature.skl-nvidia.pypi-dependencies]
torch = { version = "*", index = "https://download.pytorch.org/whl/cu129" }

[feature.skl-nvidia.activation.env]
SCIPY_ARRAY_API = "1"

# Native RAPIDS cuML estimators (not Array API / not cuml.accel). CUDA-only.
[feature.cuml]
# Explicit priority: feature channels are appended after the workspace's
# conda-forge, whose older rmm/pylibraft would otherwise shadow rapidsai's
# under strict channel priority.
channels = [{ channel = "rapidsai", priority = 1 }, "conda-forge", "nvidia"]
platforms = ["linux-64-cuda-12-9"]

[feature.cuml.dependencies]
cuda-version = "12.9.*"
cuml = "*"

[feature.skl-intel]
# The XPU torch/triton builds and dpnp's oneAPI stack are Linux-only.
platforms = ["linux-64"]

[feature.skl-intel.dependencies]
setuptools = "<82"

[feature.skl-intel.pypi-dependencies]
dpctl = "*"
dpnp = "*"
triton-xpu = { version = "*", index = "https://download.pytorch.org/whl/xpu" }
torch = { version = ">=2.13.0", index = "https://download.pytorch.org/whl/xpu" }

[feature.skl-intel.activation.env]
SCIPY_ARRAY_API = "1"

[feature.skl-cpu.pypi-dependencies]
array-api-compat = "*"

[feature.skl-cpu.target.linux.pypi-dependencies]
# PyTorch only publishes a separate slim "+cpu" build (no bundled CUDA) to
# this index for Linux/Windows; macOS has no CUDA variant to begin with, so
# its plain PyPI wheel (below) is already CPU/MPS-only - see
# feature.skl-cpu.target.osx-arm64.pypi-dependencies.
torch = { version = "*", index = "https://download.pytorch.org/whl/cpu" }

[feature.skl-cpu.target.win-64.pypi-dependencies]
# Same slim CPU-only PyTorch build as target.linux above - see its comment.
torch = { version = "*", index = "https://download.pytorch.org/whl/cpu" }

[feature.skl-cpu.target.osx-arm64.pypi-dependencies]
torch = "*"

[feature.skl-cpu.activation.env]
SCIPY_ARRAY_API = "1"

[feature.skl-mps]
# Apple GPU (Metal) Array API, only meaningful on Apple Silicon.
platforms = ["osx-arm64"]

[feature.skl-mps.pypi-dependencies]
array-api-compat = "*"
# The plain PyPI wheel already includes MPS support on macOS - no separate
# index needed, unlike the Linux/CUDA/CPU-only builds above.
torch = "*"

[feature.skl-mps.activation.env]
SCIPY_ARRAY_API = "1"
# Falls back to CPU for ops PyTorch hasn't implemented on the MPS backend,
# instead of erroring - same flag scikit-learn's own CI sets for its
# macOS arm64 array API job (sklearn-src/.github/workflows/unit-tests.yml).
PYTORCH_ENABLE_MPS_FALLBACK = "1"

[feature.reporting.dependencies]
scikit-learn = "1.9.*"
jupyter = "*"
matplotlib = "*"
plotly = "*"

[feature.reporting.pypi-dependencies]
Jinja2 = "*"

[environments]
# Explicit so a bare `pixi run` (no `-e`) still gets conda-forge numpy/scipy/
# pandas instead of silently falling back to whatever PyPI transitively
# resolves from openml now that they're no longer in the base [dependencies].
default = ["py314", "numpy-conda"]
sklearn-pypi = ["py314", "sklearn-pypi"]
sklearn-pypi-freethreading = ["py314t", "sklearn-pypi"]
sklearn-cf-default = ["py314", "sklearn-conda", "numpy-conda"]
# ^ this environement is the exact same than "sklearn-openblas-libgomp" in practice
# so we never use it:
sklearn-cf-libgomp-openblas = ["py314", "sklearn-openblas-pthreads", "numpy-conda"]
sklearn-cf-libomp-openblas = ["py314", "sklearn-openblas-pthreads", "sklearn-openblas-pthreads-kmp-llvm", "numpy-conda"]
sklearn-cf-libomp-openblas-omp = ["py314", "sklearn-openblas-openmp", "numpy-conda"]
sklearn-cf-mkl = ["py314", "sklearn-mkl", "numpy-conda"]
sklearn-dev = ["py314", "sklearn-dev", "numpy-conda"]
sklearn-dev-libomp = ["py314", "sklearn-dev", "sklearn-dev-libomp", "numpy-conda"]
sklearn-dev-mkl = ["py314", "sklearn-dev", "sklearn-dev-mkl", "numpy-conda"]
sklearn-dev-freethreading = ["sklearn-dev", "py314t", "sklearn-dev-freethreading"]
skl-cpu = ["py314", "sklearn-pypi", "skl-cpu"]
skl-intel = ["py314", "sklearn-pypi", "skl-intel"]
skl-nvidia = ["py314", "sklearn-pypi", "skl-nvidia"]
skl-mps = ["py314", "sklearn-pypi", "skl-mps"]
intel = ["py314", "intel", "numpy-conda"]
reporting = ["py314", "reporting", "numpy-conda"]
cuml = ["py314", "sklearn-conda", "cuml", "numpy-conda"]
