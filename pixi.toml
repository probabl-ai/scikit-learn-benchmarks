[workspace]
name = "scikit-learn-benchmarks"
channels = ["conda-forge"]
requires-pixi = ">=0.75"
platforms = [
    "linux-64",
    { name = "linux-64-cuda-12-9", platform = "linux-64", cuda = "12.9" },
]

[dependencies]
python = "3.12.*"
ipykernel = "*"
tabulate = "*"
tqdm = "*"
psutil = "*"
requests = "*"
py-cpuinfo = "*"
pydantic = "*"
pytest = "*"

[pypi-dependencies]
scikit-learn-benchmarks = { path = ".", editable = true }
openml = ">=0.15.1"
dpctl = "*"
nvidia-ml-py = "*"
py-spy = "*"
joblib = { git = "https://github.com/cakedev0/joblib.git", branch = "vendor-loky-cpu-affinity-physical" }

[feature.sklearn-pypi.pypi-dependencies]
scikit-learn = "==1.9.*"
# Vanilla `pip install scikit-learn` also pulls numpy/scipy/pandas as PyPI
# wheels (bundled OpenBLAS), not conda-forge builds - keep this environment
# on the same wheels so it reflects what most users actually run. fastparquet/
# h5py/matplotlib have to come from PyPI here too: their conda-forge builds
# link against conda numpy, which would drag conda numpy/pandas back in as a
# transitive conda dependency and defeat the point.
numpy = "*"
scipy = "*"
pandas = "<3"
fastparquet = "*"
h5py = "*"
matplotlib = "*"

[feature.numpy-conda.dependencies]
# numpy/scipy/pandas, plus the conda packages that transitively require
# conda-built numpy/pandas (fastparquet, h5py, matplotlib), for every
# conda-forge-built scikit-learn environment. Kept out of the base
# [dependencies] so `sklearn-pypi` (and the Array API environments layered
# on it) can source all of these from PyPI instead - see
# feature.sklearn-pypi.pypi-dependencies above.
numpy = "*"
scipy = "*"
pandas = "<3"
fastparquet = "*"
h5py = "*"
matplotlib = "*"

[feature.sklearn-conda.dependencies]
scikit-learn = "1.9.*"

[feature.sklearn-openblas-pthreads.dependencies]
libblas = { version = "*", build = "*_openblas" }
liblapack = { version = "*", build = "*_openblas" }
libopenblas = { version = "*", build = "*pthreads*" }
scikit-learn = "1.9.*"

[feature.sklearn-openblas-openmp.dependencies]
libblas = { version = "*", build = "*_openblas" }
liblapack = { version = "*", build = "*_openblas" }
libopenblas = { version = "*", build = "*openmp*" }
scikit-learn = "1.9.*"

[feature.sklearn-openblas-pthreads-kmp-llvm.dependencies]
# `_openmp_mutex=*_kmp_llvm` ships a `libgomp.so.1 -> libomp.so` compat
# symlink, so sklearn's libgomp-linked OpenMP calls get transparently
# serviced by the LLVM/Intel runtime instead - the same mechanism MKL builds
# use (see sklbench/orchestrator/env.py) - while OpenBLAS itself stays on
# plain pthreads threading (no OpenMP in BLAS).
_openmp_mutex = { version = "*", build = "*_kmp_llvm" }

[feature.sklearn-mkl]
platforms = ["linux-64"]

[feature.sklearn-mkl.dependencies]
libblas = { version = "*", build = "*mkl*" }
liblapack = { version = "*", build = "*mkl*" }
mkl = "*"
scikit-learn = "1.9.*"

[feature.sklearn-dev.dependencies]
cython = "*"
meson-python = "*"
ninja = "*"
pip = "*"
pkg-config = "*"
threadpoolctl = "*"
c-compiler = "*"
cxx-compiler = "*"

[feature.sklearn-dev.pypi-dependencies]
# Points at the checkout scripts/setup_sklearn_ref.sh manages. Run that
# script before installing this environment; it reuses this path across
# refs via `git checkout --detach`, so pixi keeps resolving this editable
# source instead of a versioned wheel and won't clobber it back on later
# `pixi run` invocations (unlike the transitive scikit-learn pulled in
# elsewhere via openml).
scikit-learn = { path = "sklearn-src", editable = true }

[feature.sklearn-dev.pypi-options]
# Build scikit-learn against this environment's own cython/meson-python/ninja
# instead of a throwaway build-isolation venv: meson-python's editable loader
# reruns ninja on every import, and it keeps pointing at the isolated venv's
# (since-deleted) toolchain if the build isn't isolated to begin with.
no-build-isolation = ["scikit-learn"]

[feature.sklearn-dev-libomp.dependencies]
# Same `_openmp_mutex=*_kmp_llvm` redirect as
# `sklearn-openblas-pthreads-kmp-llvm` above: it ships a
# `libgomp.so.1 -> libomp.so` compat symlink, so this dev build's
# libgomp-linked OpenMP calls (sklearn's own Cython parallel loops, compiled
# by the `c-compiler`/`cxx-compiler` from `sklearn-dev` above) get serviced by
# the LLVM/Intel `libomp` runtime instead - without changing which sklearn
# source is built or which BLAS it links against.
_openmp_mutex = { version = "*", build = "*_kmp_llvm" }

[feature.intel.dependencies]
scikit-learn = "1.8.*"
setuptools = "<82"

[feature.intel.pypi-dependencies]
array-api-compat = "*"
dpnp = "*"
scikit-learn-intelex-gpu = "*"

[feature.intel.activation.env]
SCIPY_ARRAY_API = "1"

[feature.skl-nvidia]
channels = ["conda-forge", "nvidia"]
platforms = ["linux-64-cuda-12-9"]

[feature.skl-nvidia.dependencies]
cuda-version = "12.9.*"
cupy = "*"

[feature.skl-nvidia.pypi-dependencies]
torch = { version = "*", index = "https://download.pytorch.org/whl/cu129" }

[feature.skl-nvidia.activation.env]
SCIPY_ARRAY_API = "1"

[feature.skl-intel.dependencies]
setuptools = "<82"

[feature.skl-intel.pypi-dependencies]
dpnp = "*"
triton-xpu = { version = "*", index = "https://download.pytorch.org/whl/xpu" }
torch = { version = ">=2.13.0", index = "https://download.pytorch.org/whl/xpu" }

[feature.skl-intel.activation.env]
SCIPY_ARRAY_API = "1"

[feature.skl-cpu.pypi-dependencies]
array-api-compat = "*"
torch = { version = "*", index = "https://download.pytorch.org/whl/cpu" }

[feature.skl-cpu.activation.env]
SCIPY_ARRAY_API = "1"

[feature.reporting.dependencies]
scikit-learn = "1.9.*"
jupyter = "*"
matplotlib = "*"
plotly = "*"

[feature.reporting.pypi-dependencies]
Jinja2 = "*"

[environments]
# Explicit so a bare `pixi run` (no `-e`) still gets conda-forge numpy/scipy/
# pandas instead of silently falling back to whatever PyPI transitively
# resolves from openml now that they're no longer in the base [dependencies].
default = ["numpy-conda"]
sklearn-pypi = ["sklearn-pypi"]
sklearn-cf-default = ["sklearn-conda", "numpy-conda"]
# ^ this environement is the exact same than "sklearn-openblas-libgomp" in practice
# so we never use it:
sklearn-cf-libgomp-openblas = ["sklearn-openblas-pthreads", "numpy-conda"]
sklearn-cf-libomp-openblas = ["sklearn-openblas-pthreads", "sklearn-openblas-pthreads-kmp-llvm", "numpy-conda"]
sklearn-cf-libomp-openblas-omp = ["sklearn-openblas-openmp", "numpy-conda"]
sklearn-cf-mkl = ["sklearn-mkl", "numpy-conda"]
sklearn-dev = ["sklearn-dev", "numpy-conda"]
sklearn-dev-libomp = ["sklearn-dev", "sklearn-dev-libomp", "numpy-conda"]
skl-cpu = ["sklearn-pypi", "skl-cpu"]
skl-intel = ["sklearn-pypi", "skl-intel"]
skl-nvidia = ["sklearn-pypi", "skl-nvidia"]
intel = ["intel", "numpy-conda"]
reporting = ["reporting", "numpy-conda"]
