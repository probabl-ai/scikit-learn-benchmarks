[workspace]
name = "scikit-learn-benchmarks"
channels = ["conda-forge"]
requires-pixi = ">=0.75"
platforms = [
    "linux-64",
    { name = "linux-64-cuda-12-9", platform = "linux-64", cuda = "12.9" },
]

[dependencies]
python = "3.12.*"
numpy = "*"
scipy = "*"
pandas = "<3"
ipykernel = "*"
tabulate = "*"
fastparquet = "*"
h5py = "*"
tqdm = "*"
psutil = "*"
requests = "*"
py-cpuinfo = "*"
matplotlib = "*"
pydantic = "*"
pytest = "*"

[pypi-dependencies]
scikit-learn-benchmarks = { path = ".", editable = true }
openml = ">=0.15.1"
dpctl = "*"
nvidia-ml-py = "*"
py-spy = "*"
loky = { git = "https://github.com/cakedev0/loky.git", branch = "cpu_affinity_physical" }

[feature.sklearn.pypi-dependencies]
scikit-learn = "==1.9.*"

[feature.sklearn-conda.dependencies]
scikit-learn = "1.9.*"

[feature.sklearn-openblas-pthreads.dependencies]
libblas = { version = "*", build = "*_openblas" }
liblapack = { version = "*", build = "*_openblas" }
libopenblas = { version = "*", build = "*pthreads*" }
scikit-learn = "1.9.*"

[feature.sklearn-openblas-openmp.dependencies]
libblas = { version = "*", build = "*_openblas" }
liblapack = { version = "*", build = "*_openblas" }
libopenblas = { version = "*", build = "*openmp*" }
scikit-learn = "1.9.*"

[feature.sklearn-mkl]
platforms = ["linux-64"]

[feature.sklearn-mkl.dependencies]
libblas = { version = "*", build = "*mkl*" }
liblapack = { version = "*", build = "*mkl*" }
mkl = "*"
scikit-learn = "1.9.*"

[feature.sklearn-dev.dependencies]
cython = "*"
joblib = "*"
meson-python = "*"
ninja = "*"
pip = "*"
pkg-config = "*"
threadpoolctl = "*"
c-compiler = "*"
cxx-compiler = "*"

[feature.intel.dependencies]
scikit-learn = "1.8.*"
setuptools = "<82"

[feature.intel.pypi-dependencies]
array-api-compat = "*"
dpnp = "*"
scikit-learn-intelex-gpu = "*"

[feature.intel.activation.env]
SCIPY_ARRAY_API = "1"

[feature.skl-nvidia]
channels = ["conda-forge", "nvidia"]
platforms = ["linux-64-cuda-12-9"]

[feature.skl-nvidia.dependencies]
cuda-version = "12.9.*"
cupy = "*"

[feature.skl-nvidia.pypi-dependencies]
torch = { version = "*", index = "https://download.pytorch.org/whl/cu129" }

[feature.skl-nvidia.activation.env]
SCIPY_ARRAY_API = "1"

[feature.skl-intel.dependencies]
setuptools = "<82"

[feature.skl-intel.pypi-dependencies]
dpnp = "*"
triton-xpu = { version = "*", index = "https://download.pytorch.org/whl/xpu" }
torch = { version = ">=2.13.0", index = "https://download.pytorch.org/whl/xpu" }

[feature.skl-intel.activation.env]
SCIPY_ARRAY_API = "1"

[feature.skl-cpu.pypi-dependencies]
array-api-compat = "*"
torch = { version = "*", index = "https://download.pytorch.org/whl/cpu" }

[feature.skl-cpu.activation.env]
SCIPY_ARRAY_API = "1"

[feature.reporting.dependencies]
scikit-learn = "1.9.*"
jupyter = "*"
matplotlib = "*"
plotly = "*"

[feature.reporting.pypi-dependencies]
Jinja2 = "*"

[environments]
sklearn = ["sklearn"]
sklearn-conda = ["sklearn-conda"]
sklearn-openblas-pthreads = ["sklearn-openblas-pthreads"]
sklearn-openblas-openmp = ["sklearn-openblas-openmp"]
sklearn-mkl = ["sklearn-mkl"]
sklearn-dev = ["sklearn-dev"]
skl-cpu = ["sklearn", "skl-cpu"]
skl-intel = ["sklearn", "skl-intel"]
skl-nvidia = ["sklearn", "skl-nvidia"]
intel = ["intel"]
reporting = ["reporting"]
