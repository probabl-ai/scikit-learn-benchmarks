name: macOS sklearn-dev Check

# Exercises the "Running Against scikit-learn Branches" workflow from
# CONTRIBUTING.md on a GitHub-hosted macOS (Apple Silicon / osx-arm64)
# runner: a full scikit-learn clone + from-source (meson-python) build into
# the sklearn-dev Pixi environment, then a benchmark run against it. This is
# the heavier counterpart macos-setup-check.yml deliberately skips - kept as
# a separate workflow so it doesn't slow down that fast smoke check. Manual
# dispatch only for now.
#
# sklearn-dev-libomp is NOT covered here: it's restricted to linux-64 in
# pixi.toml (its `_openmp_mutex=*_kmp_llvm` libgomp->libomp redirect is
# meaningless on macOS, which already links OpenMP against libomp directly).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: scikit-learn ref (branch/tag/commit) to build and benchmark
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  sklearn-dev:
    # See macos-setup-check.yml for why macos-15 specifically (current
    # non-deprecated GitHub-hosted Apple Silicon image).
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        # This job never reads results/, so skip the LFS pull (Git LFS
        # itself is still installed below, for the checkout's clean filter).
        with:
          lfs: false

      - name: Install pixi
        # CONTRIBUTING.md > Setup > Pre-requisites.
        run: |
          curl -fsSL https://pixi.sh/install.sh | sh
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Install Git LFS
        # CONTRIBUTING.md > Setup > Pre-requisites.
        run: |
          pixi global install git-lfs
          git lfs install

      - name: Build scikit-learn and run the smoke-check config
        # run.sh's env@owner:ref form runs scripts/setup_sklearn_ref.sh
        # first (clone + `pip install --no-build-isolation --editable`,
        # compiled via sklearn-dev's own cython/meson-python/ninja/
        # c-compiler/cxx-compiler), then `pixi run --frozen -e sklearn-dev
        # python -m sklbench ...`.
        env:
          SKLEARN_REF: ${{ inputs.ref }}
        run: |
          ./run.sh "sklearn-dev@scikit-learn:$SKLEARN_REF" --config configs/smoke_check_test.py --results-dir ./results/tests/
