name: Run Benchmarks

on:
  workflow_dispatch:
    inputs:
      env:
        description: >
          Space/comma-separated Pixi environments to benchmark, e.g.
          "sklearn-pypi skl-intel". Special tokens: [all] = runner-default env
          set, [builds] = sklearn-cf-default/libgomp-openblas/libomp-openblas-omp/mkl.
          Combinable, e.g. "[all] [builds]".
        required: true
        default: "[all]"
        type: string
      runner:
        description: >
          Self-hosted runner to benchmark on. "intel-all" runs both Intel
          machines; "aws-nvidia-l4" runs only the AWS L4 host; "all" runs
          both Intel machines and the AWS L4 host.
        required: true
        default: intel-laptop
        type: choice
        options:
          - intel-laptop
          - intel-xeon
          - intel-all
          - aws-nvidia-l4
          - all
      config:
        description: >
          Path to a benchmark config script, e.g. configs/all_models.py.
          Results are not committed/PR'd if the path contains "test".
        required: true
        default: configs/all_models.py
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  runner-ready:
    # Runs on the AWS runner so `provision` can tell when that runner is
    # online. No `needs`: it is queued from the start, in parallel with
    # `provision`.
    if: inputs.runner == 'aws-nvidia-l4' || inputs.runner == 'all'
    # Persistent self-hosted runner; it keeps `.pixi/` and `data_cache/`
    # between runs. `provision` starts the host, and this job stays queued
    # until the runner is online.
    runs-on:
      group: aws-gpu-runners
    # Execution timeout only; `provision` decides when to give up waiting.
    timeout-minutes: 5
    # Runs on the GPU box; no repository access needed.
    permissions: {}
    steps:
      - name: Confirm the runner is online
        run: |
          echo "runner online on $(hostname)"
          nvidia-smi -L

  provision:
    # The reusable workflow starts the instance and waits for `runner-ready`.
    # Only this caller gets the AWS permissions.
    if: inputs.runner == 'aws-nvidia-l4' || inputs.runner == 'all'
    permissions:
      id-token: write
      contents: read
      actions: read
    uses: ./.github/workflows/aws-provision.yml

  benchmark-intel:
    # No AWS dependency: the Intel runners are always online.
    if: inputs.runner != 'aws-nvidia-l4'
    permissions:
      contents: write
      pull-requests: write
    strategy:
      # `intel-all` expands to one job per machine; `fail-fast: false` lets
      # both finish even if one fails.
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(
          inputs.runner == 'intel-laptop' && '["intel-laptop"]' ||
          inputs.runner == 'intel-xeon' && '["intel-xeon"]' ||
          '["intel-laptop","intel-xeon"]') }}
    uses: ./.github/workflows/benchmark-run.yml
    with:
      runner: ${{ matrix.runner }}
      runs_on: ${{ matrix.runner == 'intel-laptop' && '["Linux","X64","intel-gpu","float64-gpu"]' || '["Linux","X64","intel-xeon"]' }}
      env: ${{ inputs.env }}
      config: ${{ inputs.config }}

  benchmark-aws:
    # Separate caller because it needs `runner-ready`. `provision` can return
    # while that job is still queued behind another benchmark.
    if: inputs.runner == 'aws-nvidia-l4' || inputs.runner == 'all'
    needs: [provision, runner-ready]
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/benchmark-run.yml
    with:
      runner: aws-nvidia-l4
      runs_on: '{"group":"aws-gpu-runners"}'
      env: ${{ inputs.env }}
      config: ${{ inputs.config }}

  cleanup-aws:
    # Clear `runner-ready` after an unsuccessful provision. For `all`, wait
    # for Intel; for AWS-only, `benchmark-intel` is skipped. Do not cancel
    # when provision succeeded and left the job queued behind a busy runner.
    needs: [benchmark-intel, provision]
    if: >
      always() &&
      needs.provision.result != 'success' &&
      (inputs.runner == 'all' || inputs.runner == 'aws-nvidia-l4')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Clear runner-ready after an unsuccessful provision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "runner-ready")][0].status // "missing"')" \
            || status="unknown"
          case "$status" in
            in_progress|completed)
              echo "runner-ready is $status; nothing to clear"
              ;;
            unknown)
              echo "::warning::could not read runner-ready status; leaving the run for manual cleanup"
              ;;
            *)
              echo "::error::runner-ready is still $status after the Intel jobs finished; cancelling the run to clear it"
              gh api -X POST \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel" \
                >/dev/null || true
              ;;
          esac
