name: Dashboard Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          lfs: false

      - name: Cache Git LFS objects
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('results/records/**', 'results/hardware-envs/**', 'results/software-envs/**') }}
          restore-keys: |
            lfs-

      - name: Pull needed LFS objects
        # Dashboard generation only reads results/records, results/hardware-envs,
        # and results/software-envs (see sklbench/reporting/matching.py and
        # envs.py). results/profiles is only ever `.exists()`-checked and linked
        # to via a GitHub raw URL, never read locally, so it's excluded here to
        # avoid re-downloading its LFS content (the bulk of this repo's LFS
        # bandwidth) on every push to main.
        run: |
          git lfs pull --include "results/records/**,results/hardware-envs/**,results/software-envs/**"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.75.0
          environments: reporting
          # `locked` (`pixi install --locked`) makes pixi verify the whole
          # workspace lock is fresh, which canonicalizes every environment's
          # path dependencies - including sklearn-dev's local scikit-learn
          # checkout, which never exists on this runner. `frozen` trusts the
          # lock as-is and skips that cross-environment check.
          locked: false
          frozen: true
          cache: true

      - name: Generate dashboards
        run: |
          mkdir -p _site
          for script in dashboards/gen_*.py; do
            # --frozen: without it, `pixi run` re-verifies the whole
            # workspace lockfile is up to date, which canonicalizes every
            # environment's path dependencies - including sklearn-dev's
            # local scikit-learn checkout (sklearn-src), which doesn't exist
            # on this runner. See the setup-pixi `frozen: true` note above.
            pixi run --frozen -e reporting python "$script" --output-dir _site
          done

      - name: Check out persisted dashboard snapshots
        # deploy-pages replaces the whole site on every run, so snapshots
        # published by dashboard-snapshot.yml (which live only on the
        # dashboard-snapshots branch) have to be re-merged into _site here
        # on every build, not just once. continue-on-error covers the case
        # where that branch doesn't exist yet (no snapshot published so far).
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        continue-on-error: true
        with:
          ref: dashboard-snapshots
          path: _snapshot_storage
          lfs: false

      - name: Merge snapshots into site
        run: |
          if [ -d _snapshot_storage/snapshots ]; then
            mkdir -p _site/snapshots
            cp -r _snapshot_storage/snapshots/. _site/snapshots/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
