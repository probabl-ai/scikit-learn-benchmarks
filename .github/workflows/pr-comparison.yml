name: PR Comparison

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate_and_parse:
    # Only PRs from people who already have workflow_dispatch access to
    # run-benchmarks.yml (with equally arbitrary env@owner:ref/config
    # inputs) can trigger a self-hosted benchmark run this way - no new
    # risk class versus what's already accepted in this repo.
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    outputs:
      parse_ok: ${{ steps.parse.outputs.ok }}
      runs: ${{ steps.parse.outputs.runs }}
      runners: ${{ steps.parse.outputs.runners }}
      dashboards: ${{ steps.parse.outputs.dashboards }}
      sklearn_owner: ${{ steps.parse.outputs.sklearn_owner }}
      sklearn_head_ref: ${{ steps.parse.outputs.sklearn_head_ref }}
      skip_main: ${{ steps.skip_main.outputs.skip_main }}
    steps:
      - name: Check out repository (base, trusted)
        # Pinned to the base sha, not the PR head, so parsing always runs
        # the trusted version of this script - this job never executes
        # PR-supplied code.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          lfs: false
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.75.0
          environments: reporting
          locked: false
          frozen: true
          cache: true

      - name: Save PR body
        # Never interpolate the PR body directly into a `run:` script
        # string (Actions would template it into the script text before
        # the shell even runs - a script-injection vector). Passing it via
        # env: and letting the shell substitute the variable is safe.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.md"

      - name: Parse sklbench-compare directive
        id: parse
        run: |
          pixi run --frozen -e reporting python scripts/parse_compare_directive.py \
            --body-file "$RUNNER_TEMP/pr_body.md" --github-output "$GITHUB_OUTPUT"

      - name: Check for a [skip main] flag on the latest commit
        # Fetched via the API rather than local `git log`, since this job's
        # checkout is pinned to the base sha (see above) and a shallow
        # checkout wouldn't have the PR head commit's object locally
        # anyway. Matched case-insensitively against just the head commit's
        # message, mirroring common "[skip ci]"-style conventions.
        id: skip_main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          message=$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" |
            pixi run --frozen -e reporting python3 -c "import json,sys; print(json.load(sys.stdin)['commit']['message'])")
          if grep -qiF '[skip main]' <<< "$message"; then
            echo "skip_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_main=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject fork PRs once a directive is present
        # pull_request runs withhold secrets and a write-scoped GITHUB_TOKEN
        # whenever the PR's head repo differs from the base repo,
        # regardless of author_association - so a directive on a fork PR
        # could benchmark but could never comment or deploy. Fail loudly via
        # the only channel available (a check annotation) instead of
        # silently doing nothing.
        if: steps.parse.outputs.directive_present == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::sklbench-compare requires a branch pushed directly to this repo, not a personal fork - GitHub withholds secrets/write-token from fork PRs regardless of permissions, so no comment or dashboard could be posted. Push your branch to scikit-learn-benchmarks directly instead." >&2
          exit 1

      - name: Build and post status comment
        if: steps.parse.outputs.directive_present == 'true'
        env:
          PARSE_OK: ${{ steps.parse.outputs.ok }}
          PARSE_ERROR: ${{ steps.parse.outputs.error }}
          RUNS: ${{ steps.parse.outputs.runs }}
          DASHBOARDS: ${{ steps.parse.outputs.dashboards }}
          SKLEARN_OWNER: ${{ steps.parse.outputs.sklearn_owner }}
          SKLEARN_HEAD_REF: ${{ steps.parse.outputs.sklearn_head_ref }}
          SKIP_MAIN: ${{ steps.skip_main.outputs.skip_main }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          {
            if [ "$PARSE_OK" != "true" ]; then
              echo "**sklbench-compare directive is malformed:**"; echo; echo "$PARSE_ERROR"
            else
              # RUNS is the JSON array string parse_compare_directive.py writes
              # (e.g. [{"runner": ..., "env": ..., "config": ...}]) - render it
              # as a plain comma-separated list instead. The `runners` output
              # (distinct runner values out of RUNS) drives the matrix below.
              runs_display=$(python3 -c "import json,sys; runs=json.loads(sys.argv[1]); print(', '.join(f\"{r['runner']}: {r['config']} ({r['env']})\" for r in runs))" "$RUNS")
              echo "Comparing \`$SKLEARN_OWNER:$SKLEARN_HEAD_REF\` against scikit-learn \`main\`:"
              echo "$runs_display"
              dashboards_display=$(python3 -c "import json,sys; print(', '.join(json.loads(sys.argv[1])))" "$DASHBOARDS")
              [ -n "$dashboards_display" ] && echo "Extra dashboards: $dashboards_display"
              if [ "$SKIP_MAIN" = "true" ]; then
                echo "\`[skip main]\` detected: reusing each runner's previously-published \`main\` results instead of re-benchmarking, if available."
              fi
              echo "Results post as separate comments below as each runner finishes."
            fi
          } > "$RUNNER_TEMP/status.md"
          pixi run --frozen -e reporting python scripts/comment_pr.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --marker "<!-- bench-comparison-bot -->" \
            --body-file "$RUNNER_TEMP/status.md"

      - name: Fail if directive invalid
        if: steps.parse.outputs.directive_present == 'true' && steps.parse.outputs.ok != 'true'
        run: exit 1

  benchmark-and-publish:
    needs: gate_and_parse
    if: needs.gate_and_parse.outputs.parse_ok == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.gate_and_parse.outputs.runners) }}
    # Deliberately the SAME group name run-benchmarks.yml uses for a given
    # runner, not a PR-scoped one: both workflows mutate the single shared
    # sklearn-src/ checkout on that physical box via setup_sklearn_ref.sh
    # and must serialize against each other, not just against themselves.
    concurrency:
      group: benchmark-${{ matrix.runner }}
      cancel-in-progress: false
    runs-on: ${{ fromJSON(
      matrix.runner == 'intel-laptop' && '["Linux","X64","intel-gpu","float64-gpu"]' ||
      matrix.runner == 'intel-gnr' && '["Linux","X64","intel-gnr"]' ||
      '[]') }}
    timeout-minutes: 1440
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RUNS: ${{ needs.gate_and_parse.outputs.runs }}
      # Applies once per runner's job (not filtered by THIS_RUNNER like RUNS
      # is) - see COMPARISONS_PR.md's `dashboards:` key.
      DASHBOARDS: ${{ needs.gate_and_parse.outputs.dashboards }}
      # This job's matrix.runner - RUNS holds every runner's tuples, each
      # step below filters down to the ones targeting this runner.
      THIS_RUNNER: ${{ matrix.runner }}
      SKLEARN_OWNER: ${{ needs.gate_and_parse.outputs.sklearn_owner }}
      SKLEARN_HEAD_REF: ${{ needs.gate_and_parse.outputs.sklearn_head_ref }}
      # Set by gate_and_parse from a `[skip main]` flag on the PR's latest
      # commit message. The "Restore cached main results" step below flips
      # this back to 'false' (via $GITHUB_ENV) if no usable cache is found,
      # so later steps always reflect what actually happened this run.
      SKIP_MAIN: ${{ needs.gate_and_parse.outputs.skip_main }}
      # Deterministic from PR number + runner, so it's known before the
      # "Deploy to Cloudflare Pages" step actually publishes there - shared
      # by that step, the dashboard-generation steps (to link JSON/profile
      # viewers at this run's to-be-deployed site instead of a GitHub raw URL
      # that 404s for these never-committed ephemeral results), and the
      # comment step.
      PAGES_BRANCH: pr-${{ github.event.pull_request.number }}-compare-${{ matrix.runner }}
      # Job-level (not just `export`-ed in one step) so both the "Generate
      # comparison dashboard" and "Generate additional dashboards" steps see
      # it - a step-local `export` doesn't persist to the next `run:` step.
      SKLBENCH_PR_COMPARE_SITE_URL: https://${{ format('pr-{0}-compare-{1}', github.event.pull_request.number, matrix.runner) }}.sklbench-pr-comparison.pages.dev
    steps:
      - name: Set scratch directories
        # The `runner` context (unlike the $RUNNER_TEMP env var it mirrors)
        # is only available within steps, not in a job-level `env:` block -
        # so RESULTS_DIR/SITE_DIR are computed here instead. Basename of
        # RESULTS_DIR must stay literally "results": pr_comparison_dashboard.py's
        # readers default to a `results/` directory relative to the CWD
        # it's invoked from, and the "Generate comparison dashboard" step's
        # working-directory is RESULTS_DIR's parent. Kept under
        # $RUNNER_TEMP, well outside the git checkout, so it's immune to
        # this job's own `git clean -ffdx results/` step and never collides
        # with the repo's real (committed, unused-by-this-job) results/.
        run: |
          echo "RESULTS_DIR=$RUNNER_TEMP/pr-compare/results" >> "$GITHUB_ENV"
          echo "SITE_DIR=$RUNNER_TEMP/pr-compare/site" >> "$GITHUB_ENV"

      - name: Check out repository
        # Default pull_request checkout (merge of PR head into base) is
        # intentional here, unlike gate_and_parse's base-pinned checkout:
        # `runs:` may point at a config file this very PR adds. Same
        # trust level workflow_dispatch on run-benchmarks.yml already
        # assumes for a collaborator's branch.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          lfs: false
          clean: false

      - name: Clean up results from previous runs
        run: git clean -ffdx results/

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.75.0
          # sklearn-pypi (lightweight, always installable, no sklearn-src/
          # path dependency) is used to validate the config below before
          # committing to the much slower sklearn-dev clone+build.
          environments: reporting sklearn-pypi
          locked: false
          frozen: true
          cache: false
          post-cleanup: false
          pixi-bin-path: ${{ runner.temp }}/bin/pixi

      - name: Validate config
        # A prior version of this check lived in run.sh itself, using
        # `-e default` - broken for any config calling
        # implementations_for_pixi_env() (e.g. all_models.py and anything
        # derived from it), since "default" isn't an accepted
        # PIXI_ENVIRONMENT_NAME. Removed there; kept here, scoped to this
        # workflow, using a real accepted env instead - catching a typo'd
        # config path/estimator name before a many-minutes sklearn-dev
        # clone+build is still worth it. Looped over the unique config paths
        # in RUNS that target this runner (several tuples can share a
        # config, and other runners' tuples aren't this job's concern).
        run: |
          pixi run --frozen -e reporting python3 -c "import json,os; runs=[r for r in json.loads(os.environ['RUNS']) if r['runner']==os.environ['THIS_RUNNER']]; _=[print(c) for c in dict.fromkeys(r['config'] for r in runs)]" > "$RUNNER_TEMP/configs.txt"
          while IFS= read -r config; do
            pixi run --frozen -e sklearn-pypi python -m sklbench --config "$config" --validate-only
          done < "$RUNNER_TEMP/configs.txt"

      - name: Validate requested dashboard scripts exist
        # Catches a typo'd `dashboards:` entry (see COMPARISONS_PR.md) before
        # committing to the benchmark run below, same rationale as the
        # config validation above.
        run: |
          pixi run --frozen -e reporting python3 -c "import json,os; _=[print(d) for d in json.loads(os.environ['DASHBOARDS'])]" > "$RUNNER_TEMP/dashboards.txt"
          while IFS= read -r dashboard; do
            [ -f "$dashboard" ] || { echo "::error::requested dashboard script not found: $dashboard" >&2; exit 1; }
          done < "$RUNNER_TEMP/dashboards.txt"

      - name: Restore cached main results
        # `[skip main]` (see COMPARISONS_PR.md and gate_and_parse's
        # skip_main step) skips re-benchmarking scikit-learn `main` and
        # instead downloads the `...:main` result files this same runner's
        # site previously published - written by "Write main-results cache
        # manifest" below on whichever run last actually benchmarked main
        # (fresh or itself restored). Falls back to a fresh main run (by
        # flipping SKIP_MAIN back to 'false' for the rest of this job) if no
        # cache is reachable yet or it turns out to be empty, e.g. the very
        # first comparison on this PR/runner, or a previous run whose main
        # benchmark failed outright.
        if: env.SKIP_MAIN == 'true'
        run: |
          manifest_url="$SKLBENCH_PR_COMPARE_SITE_URL/results-manifest-main.txt"
          if ! curl -fsSL "$manifest_url" -o "$RUNNER_TEMP/main-manifest.txt"; then
            echo "::warning::[skip main] requested but no cached main results are published yet at $manifest_url; benchmarking scikit-learn main fresh for this run."
            echo "SKIP_MAIN=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ ! -s "$RUNNER_TEMP/main-manifest.txt" ]; then
            echo "::warning::[skip main] requested but the cached main-results manifest at $manifest_url is empty; benchmarking scikit-learn main fresh for this run."
            echo "SKIP_MAIN=false" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p "$RESULTS_DIR"
          while IFS= read -r relpath; do
            [ -n "$relpath" ] || continue
            dest="$RESULTS_DIR/$relpath"
            mkdir -p "$(dirname "$dest")"
            if ! curl -fsSL "$SKLBENCH_PR_COMPARE_SITE_URL/results/$relpath" -o "$dest"; then
              echo "::warning::failed to download cached main result '$relpath'; benchmarking scikit-learn main fresh for this run."
              rm -rf "$RESULTS_DIR"
              echo "SKIP_MAIN=false" >> "$GITHUB_ENV"
              exit 0
            fi
          done < "$RUNNER_TEMP/main-manifest.txt"
          echo "Restored $(wc -l < "$RUNNER_TEMP/main-manifest.txt") cached main result file(s) from $SKLBENCH_PR_COMPARE_SITE_URL"

      - name: Run comparison benchmark
        # Reuses run.sh exactly as CONTRIBUTING.md's "Running Against
        # scikit-learn Branches" documents for a PR-vs-base comparison:
        # sequential setup_sklearn_ref.sh + sklbench run per env@owner:ref
        # entry, one shared sklearn-src/ checkout re-pointed between them.
        # Looped over every (env, config) tuple in RUNS that targets this
        # runner, all accumulating into the same $RESULTS_DIR so one
        # dashboard covers all of them - mirrors run.sh's own
        # accumulate-status-and-continue pattern rather than aborting after
        # the first failing tuple. When SKIP_MAIN is (still) 'true' at this
        # point, the "main" env@owner:ref arg is omitted entirely and the
        # cached results restored above stand in for it.
        continue-on-error: true
        run: |
          set -o pipefail
          pixi run --frozen -e reporting python3 -c "import json,os; runs=[r for r in json.loads(os.environ['RUNS']) if r['runner']==os.environ['THIS_RUNNER']]; _=[print(f\"{r['env']}\t{r['config']}\") for r in runs]" > "$RUNNER_TEMP/runs.tsv"
          status=0
          while IFS=$'\t' read -r env config; do
            echo "=== env=$env config=$config ===" | tee -a "$RUNNER_TEMP/bench.log"
            env_specs=("${env}@${SKLEARN_OWNER}:${SKLEARN_HEAD_REF}")
            [ "$SKIP_MAIN" = "true" ] || env_specs+=("${env}@scikit-learn:main")
            if ! ./run.sh "${env_specs[@]}" \
                --config "$config" --results-dir "$RESULTS_DIR" \
                2>&1 | tee -a "$RUNNER_TEMP/bench.log"; then
              status=1
            fi
          done < "$RUNNER_TEMP/runs.tsv"
          exit "$status"

      - name: Classify benchmark session
        id: classify
        continue-on-error: true
        run: pixi run --frozen -e reporting python scripts/classify_bench_session.py "$RUNNER_TEMP/bench.log"

      - name: Generate comparison dashboard
        # working-directory is RESULTS_DIR's parent, so its bare `results/`
        # subdirectory is exactly what pr_comparison_dashboard.py's readers pick
        # up by default (see the RESULTS_DIR comment above).
        working-directory: ${{ runner.temp }}/pr-compare
        run: |
          mkdir -p "$SITE_DIR"
          # SKLBENCH_PR_COMPARE_SITE_URL (job-level env, see above) lets
          # pr_comparison_dashboard.py link JSON/profile viewers straight at
          # this run's to-be-deployed site (populated by the later "Copy
          # results to site" step) instead of a GitHub raw URL that 404s for
          # these ephemeral, never-committed results (see hosted_viewer_url_fn
          # in sklbench/reporting/envs.py).
          pixi run --manifest-path "$GITHUB_WORKSPACE/pixi.toml" --frozen -e reporting \
            python "$GITHUB_WORKSPACE/dashboards/pr_comparison_dashboard.py" --output-dir "$SITE_DIR"

      - name: Generate additional dashboards
        # Requested via the `dashboards:` key (see COMPARISONS_PR.md) - runs
        # any of this repo's own gen_*.py dashboard generators (e.g.
        # gen_hgb_dev_speedup_breakdown.py) against the same ephemeral
        # results/ dir as the comparison table above, alongside it in
        # $SITE_DIR. A no-op when DASHBOARDS is an empty list. Same
        # SKLBENCH_PR_COMPARE_SITE_URL job-level env as the step above, so a
        # dashboard using summarize_software_env's json_url_fn hook (e.g.
        # gen_hgb_dev_speedup_breakdown.py) also links the hosted site
        # rather than a 404ing GitHub-raw-URL.
        working-directory: ${{ runner.temp }}/pr-compare
        run: |
          pixi run --manifest-path "$GITHUB_WORKSPACE/pixi.toml" --frozen -e reporting \
            python3 -c "import json,os; _=[print(d) for d in json.loads(os.environ['DASHBOARDS'])]" > "$RUNNER_TEMP/dashboards.txt"
          while IFS= read -r dashboard; do
            pixi run --manifest-path "$GITHUB_WORKSPACE/pixi.toml" --frozen -e reporting \
              python "$GITHUB_WORKSPACE/$dashboard" --output-dir "$SITE_DIR"
          done < "$RUNNER_TEMP/dashboards.txt"

      - name: Write main-results cache manifest
        # Lists this run's `...:main` result files (fresh or themselves
        # restored from a previous cache above) so a later run's "Restore
        # cached main results" step can download exactly those files - see
        # scripts/write_main_results_manifest.py. Written unconditionally
        # (not gated on the benchmark step's success) so it still reflects
        # main's data even when only the PR-branch side of this run failed.
        working-directory: ${{ runner.temp }}/pr-compare
        run: |
          pixi run --manifest-path "$GITHUB_WORKSPACE/pixi.toml" --frozen -e reporting \
            python "$GITHUB_WORKSPACE/scripts/write_main_results_manifest.py" \
            --output "$SITE_DIR/results-manifest-main.txt"

      - name: Copy results to site
        # The whole results/ tree (records, profiles, software-envs,
        # hardware-envs, ...) copied wholesale onto the site, not just the
        # files a dashboard happens to link - so anything is recoverable
        # straight from the deployed site by path, and hosted_viewer_url_fn
        # (sklbench/reporting/envs.py) only has to build a URL rather than
        # copy the file itself. Same never-committed-ephemeral-results
        # rationale as SKLBENCH_PR_COMPARE_SITE_URL above: results/ here
        # only exists in this CI job's $RESULTS_DIR.
        working-directory: ${{ runner.temp }}/pr-compare
        run: |
          mkdir -p "$SITE_DIR/results"
          cp -a results/. "$SITE_DIR/results"/

      - name: Deploy to Cloudflare Pages
        id: deploy
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          branch="$PAGES_BRANCH"
          # wrangler@4 requires Node >=22; this step runs on persistent
          # self-hosted runners (unlike dashboard-preview-deploy.yml's
          # GitHub-hosted ubuntu-latest, which does have a modern enough
          # Node) whose Node version isn't managed by this repo - confirmed
          # live on intel-laptop (Node 18.19.1). wrangler@3 needs only
          # Node >=16.17.0 and has the identical `pages deploy` flags used
          # here.
          npx --yes wrangler@3 pages deploy "$SITE_DIR" --project-name=sklbench-pr-comparison --branch="$branch" \
            --commit-hash="${{ github.event.pull_request.head.sha }}" \
            --commit-message="PR #$PR_NUMBER vs scikit-learn $SKLEARN_OWNER:$SKLEARN_HEAD_REF (${{ matrix.runner }})" \
            --commit-dirty=true

      - name: Build and post comment
        if: always()
        env:
          CLASSIFY_OUTCOME: ${{ steps.classify.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          runs_display=$(pixi run --frozen -e reporting python3 -c "import json,os; runs=[r for r in json.loads(os.environ['RUNS']) if r['runner']==os.environ['THIS_RUNNER']]; print(', '.join(f\"{r['config']} ({r['env']})\" for r in runs))")
          if [ "$DEPLOY_OUTCOME" = "success" ] && [ -f "$SITE_DIR/pr_comparison.html" ]; then
            base_url="https://${PAGES_BRANCH}.sklbench-pr-comparison.pages.dev"
            # The site has no index.html, so the bare domain 404s - link
            # straight to each page. Cloudflare Pages' clean-URL rewriting
            # serves every *.html file at its extension-less path anyway.
            # List every dashboard actually written to $SITE_DIR
            # (pr_comparison.html always; any `dashboards:`-requested ones,
            # see COMPARISONS_PR.md, land there too from the "Generate
            # additional dashboards" step) instead of hardcoding filenames -
            # a gen_*.py script's output filename doesn't necessarily match
            # its script name (e.g. gen_hgb_dev_speedup_breakdown.py writes
            # hgb_speedup_breakdown.html).
            dashboard_links=$(
              { echo "pr_comparison"; (cd "$SITE_DIR" && ls *.html) | sed 's/\.html$//' | grep -v '^pr_comparison$' | sort; } |
                while IFS= read -r stem; do echo "- [$stem]($base_url/$stem)"; done
            )
            {
              echo "**${{ matrix.runner }}**: scikit-learn \`$SKLEARN_OWNER:$SKLEARN_HEAD_REF\` vs \`main\`, using: $runs_display"
              echo
              echo "$dashboard_links"
              [ "$CLASSIFY_OUTCOME" != "success" ] && echo "- Caveat: one or both benchmark sessions did not complete cleanly."
              [ "$SKIP_MAIN" = "true" ] && echo "- \`main\` results reused from this runner's previous comparison (\`[skip main]\`); not re-benchmarked."
              echo
              echo "Full run: $run_url"
            } > "$RUNNER_TEMP/comment.md"
          else
            {
              echo "**${{ matrix.runner }}**: comparison run for scikit-learn \`$SKLEARN_OWNER:$SKLEARN_HEAD_REF\` failed before a dashboard could be published."
              echo
              echo "See the full run: $run_url"
            } > "$RUNNER_TEMP/comment.md"
          fi
          pixi run --frozen -e reporting python scripts/comment_pr.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --marker "<!-- bench-comparison-bot:${{ matrix.runner }} -->" \
            --body-file "$RUNNER_TEMP/comment.md"
