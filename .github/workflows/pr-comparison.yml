name: PR Comparison

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate_and_parse:
    # Only PRs from people who already have workflow_dispatch access to
    # run-benchmarks.yml (with equally arbitrary env@owner:ref/config
    # inputs) can trigger a self-hosted benchmark run this way - no new
    # risk class versus what's already accepted in this repo.
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    outputs:
      parse_ok: ${{ steps.parse.outputs.ok }}
      runs: ${{ steps.parse.outputs.runs }}
      runners: ${{ steps.parse.outputs.runners }}
      sklearn_owner: ${{ steps.parse.outputs.sklearn_owner }}
      sklearn_head_ref: ${{ steps.parse.outputs.sklearn_head_ref }}
      skip_main: ${{ steps.skip_flags.outputs.skip_main }}
      skip_bench: ${{ steps.skip_flags.outputs.skip_bench }}
      # Derived by the parse step from `runners`: the Intel entries (a
      # matrix source that is never empty, see the `benchmark-intel` job)
      # and whether there are any at all.
      has_intel: ${{ steps.parse.outputs.has_intel }}
      intel_runners: ${{ steps.parse.outputs.intel_runners }}
    steps:
      - name: Check out repository (base, trusted)
        # Pinned to the base sha, not the PR head, so parsing always runs
        # the trusted version of this script - this job never executes
        # PR-supplied code.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          lfs: false
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.75.0
          environments: reporting
          locked: false
          frozen: true
          cache: true

      - name: Save PR body
        # Never interpolate the PR body directly into a `run:` script
        # string (Actions would template it into the script text before
        # the shell even runs - a script-injection vector). Passing it via
        # env: and letting the shell substitute the variable is safe.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.md"

      - name: Parse sklbench-compare directive
        id: parse
        run: |
          pixi run --frozen -e reporting python scripts/parse_compare_directive.py \
            --body-file "$RUNNER_TEMP/pr_body.md" --github-output "$GITHUB_OUTPUT"

      - name: Check for [skip] / [skip main] flags on the latest commit
        # Fetched via the API rather than local `git log`, since this job's
        # checkout is pinned to the base sha (see above) and a shallow
        # checkout wouldn't have the PR head commit's object locally
        # anyway. Matched case-insensitively against just the head commit's
        # message, mirroring common "[skip ci]"-style conventions.
        id: skip_flags
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          message=$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" |
            pixi run --frozen -e reporting python3 -c "import json,sys; print(json.load(sys.stdin)['commit']['message'])")
          if grep -qiF '[skip main]' <<< "$message"; then
            echo "skip_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_main=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qiF '[skip]' <<< "$message"; then
            echo "skip_bench=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_bench=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject fork PRs once a directive is present
        # pull_request runs withhold secrets and a write-scoped GITHUB_TOKEN
        # whenever the PR's head repo differs from the base repo,
        # regardless of author_association - so a directive on a fork PR
        # could benchmark but could never comment or deploy. Fail loudly via
        # the only channel available (a check annotation) instead of
        # silently doing nothing.
        if: steps.parse.outputs.directive_present == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::sklbench-compare requires a branch pushed directly to this repo, not a personal fork - GitHub withholds secrets/write-token from fork PRs regardless of permissions, so no comment or dashboard could be posted. Push your branch to scikit-learn-benchmarks directly instead." >&2
          exit 1

      - name: Build and post status comment
        if: steps.parse.outputs.directive_present == 'true'
        env:
          PARSE_OK: ${{ steps.parse.outputs.ok }}
          PARSE_ERROR: ${{ steps.parse.outputs.error }}
          RUNS: ${{ steps.parse.outputs.runs }}
          SKLEARN_OWNER: ${{ steps.parse.outputs.sklearn_owner }}
          SKLEARN_HEAD_REF: ${{ steps.parse.outputs.sklearn_head_ref }}
          SKIP_MAIN: ${{ steps.skip_flags.outputs.skip_main }}
          SKIP_BENCH: ${{ steps.skip_flags.outputs.skip_bench }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          {
            if [ "$PARSE_OK" != "true" ]; then
              echo "**sklbench-compare directive is malformed:**"; echo; echo "$PARSE_ERROR"
            else
              # RUNS is the JSON array string parse_compare_directive.py writes
              # (e.g. [{"runner": ..., "env": ..., "config": ...}]) - render it
              # as a plain comma-separated list instead. The `runners` output
              # (distinct runner values out of RUNS) drives the matrix below.
              runs_display=$(python3 -c "import json,sys; runs=json.loads(sys.argv[1]); print(', '.join(f\"{r['runner']}: {r['config']} ({r['env']})\" for r in runs))" "$RUNS")
              echo "Comparing \`$SKLEARN_OWNER:$SKLEARN_HEAD_REF\` against scikit-learn \`main\`:"
              echo "$runs_display"
              if [ "$SKIP_BENCH" = "true" ]; then
                echo "\`[skip]\` detected: no benchmarks run, each runner's dashboard is rebuilt from the results it previously published."
              elif [ "$SKIP_MAIN" = "true" ]; then
                echo "\`[skip main]\` detected: reusing each runner's previously-published \`main\` results instead of re-benchmarking, if available."
              fi
              echo "Results post as separate comments below as each runner finishes."
            fi
          } > "$RUNNER_TEMP/status.md"
          pixi run --frozen -e reporting python scripts/comment_pr.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --marker "<!-- bench-comparison-bot -->" \
            --body-file "$RUNNER_TEMP/status.md"

      - name: Fail if directive invalid
        if: steps.parse.outputs.directive_present == 'true' && steps.parse.outputs.ok != 'true'
        run: exit 1

  # The AWS L4 host is started on every comparison a directive resolves to
  # the `aws-nvidia-l4` machine, which includes every default
  # `sklbench-compare` run: a bare directive expands to all machines. A
  # directive naming Intel machines (`intel-all`, or an explicit Intel runner)
  # rebuilds on the Intel machines alone. This job is queued from the start in
  # parallel with `provision`; `provision` waits until the runner picks this
  # job up (scripts/ci/aws-provision.sh), so this is what makes the host's
  # readiness visible. `[skip]` runs rebuild on ubuntu-latest and skip both
  # AWS jobs; `[skip main]` benchmarks the branch, so it starts the host.
  runner-ready:
    needs: gate_and_parse
    if: >-
      needs.gate_and_parse.outputs.parse_ok == 'true' &&
      needs.gate_and_parse.outputs.skip_bench != 'true' &&
      contains(needs.gate_and_parse.outputs.runners, 'aws-nvidia-l4')
    runs-on:
      group: aws-gpu-runners
    # Execution timeout only; `provision` decides when to give up waiting.
    timeout-minutes: 5
    # Runs on the GPU box; no repository access needed.
    permissions: {}
    steps:
      - name: Confirm the runner is online
        run: |
          echo "runner online on $(hostname)"
          nvidia-smi -L

  provision:
    # Reuses run-benchmarks.yml's reusable workflow so the AWS credentials
    # and role live in aws-provision.yml alone.
    # Only this job gets the AWS permissions.
    needs: gate_and_parse
    if: >-
      needs.gate_and_parse.outputs.parse_ok == 'true' &&
      needs.gate_and_parse.outputs.skip_bench != 'true' &&
      contains(needs.gate_and_parse.outputs.runners, 'aws-nvidia-l4')
    permissions:
      id-token: write
      contents: read
      actions: read
    uses: ./.github/workflows/aws-provision.yml

  benchmark-intel:
    # The Intel machines are always online, so these matrix jobs take no
    # dependency on `provision` or `runner-ready` at all: a failed, slow or
    # hung GPU provision cannot suppress them. One matrix job per Intel
    # runner the directive names.
    #
    # `intel_runners` and `has_intel` are derived by the parse step from the
    # directive's `runners`; for an AWS-only directive it holds the single
    # placeholder `none`, and the `has_intel` check below skips this job,
    # since a matrix over an empty array is an expansion error.
    #
    # The publish steps this job and `benchmark-aws` share live in
    # .github/workflows/pr-comparison-benchmark.yml, so a runner's comparison
    # behaves the same whichever of the two jobs carries it.
    name: benchmark-and-publish (${{ matrix.runner }})
    needs: [gate_and_parse]
    if: >-
      needs.gate_and_parse.result == 'success' &&
      needs.gate_and_parse.outputs.parse_ok == 'true' &&
      needs.gate_and_parse.outputs.has_intel == 'true'
    strategy:
      # `intel-all` (and a bare directive) can name both Intel machines;
      # one failing matrix job must not cancel the other.
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.gate_and_parse.outputs.intel_runners) }}
    # Deliberately the SAME group name run-benchmarks.yml uses for a given
    # runner, not a PR-scoped one: both workflows mutate the single shared
    # sklearn-src/ checkout on that physical box via setup_sklearn_ref.sh
    # and must serialize against each other, not just against themselves.
    # A `[skip]` run only rebuilds the dashboard from previously published
    # results, so it needs neither the self-hosted box nor its lock, and
    # shouldn't queue for hours behind a benchmark holding it.
    concurrency:
      group: ${{ needs.gate_and_parse.outputs.skip_bench == 'true' && format('pr-compare-rebuild-{0}-{1}', github.event.pull_request.number, matrix.runner) || format('benchmark-{0}', matrix.runner) }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/pr-comparison-benchmark.yml
    with:
      runner: ${{ matrix.runner }}
      use_benchlock: ${{ matrix.runner != 'aws-nvidia-l4' }}
      runs: ${{ needs.gate_and_parse.outputs.runs }}
      sklearn_owner: ${{ needs.gate_and_parse.outputs.sklearn_owner }}
      sklearn_head_ref: ${{ needs.gate_and_parse.outputs.sklearn_head_ref }}
      skip_main: ${{ needs.gate_and_parse.outputs.skip_main }}
      skip_bench: ${{ needs.gate_and_parse.outputs.skip_bench }}
    secrets: inherit

  benchmark-aws:
    # The single aws-nvidia-l4 matrix job, separate from the Intel matrix
    # because it is the only job that needs the L4 host: `provision` returns
    # while `runner-ready` may still be queued behind another benchmark, so
    # this job waits for both. The Intel matrix jobs take neither dependency.
    name: benchmark-and-publish (${{ matrix.runner }})
    needs: [gate_and_parse, provision, runner-ready]
    # always() so the two AWS jobs being skipped on an Intel-only directive
    # does not skip this job too. The `contains` check keeps this job out of
    # a directive that names no AWS machine; the explicit result check keeps
    # a failed GPU provision from leaving it queued for a host that was
    # never started, and `skipped` is the normal `[skip]` case (which
    # rebuilds on ubuntu-latest instead).
    if: >-
      always() &&
      needs.gate_and_parse.result == 'success' &&
      needs.gate_and_parse.outputs.parse_ok == 'true' &&
      contains(needs.gate_and_parse.outputs.runners, 'aws-nvidia-l4') &&
      (needs.provision.result == 'skipped' ||
       (needs.provision.result == 'success' && needs.runner-ready.result == 'success'))
    strategy:
      fail-fast: false
      matrix:
        runner: ["aws-nvidia-l4"]
    # Same group as `benchmark-intel`: see the comment there.
    concurrency:
      group: ${{ needs.gate_and_parse.outputs.skip_bench == 'true' && format('pr-compare-rebuild-{0}-{1}', github.event.pull_request.number, matrix.runner) || format('benchmark-{0}', matrix.runner) }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/pr-comparison-benchmark.yml
    with:
      runner: ${{ matrix.runner }}
      use_benchlock: ${{ matrix.runner != 'aws-nvidia-l4' }}
      runs: ${{ needs.gate_and_parse.outputs.runs }}
      sklearn_owner: ${{ needs.gate_and_parse.outputs.sklearn_owner }}
      sklearn_head_ref: ${{ needs.gate_and_parse.outputs.sklearn_head_ref }}
      skip_main: ${{ needs.gate_and_parse.outputs.skip_main }}
      skip_bench: ${{ needs.gate_and_parse.outputs.skip_bench }}
    secrets: inherit

  cleanup-aws:
    # A failed provision leaves runner-ready queued indefinitely, so cancel
    # the run to clear it - same cleanup as run-benchmarks.yml. Skipped for
    # Intel-only directives (provision is skipped) and when provision worked.
    #
    # Its `needs` is `[gate_and_parse, provision, benchmark-intel]`, so a
    # cancellation cannot cut the Intel matrix jobs short - and a *skipped*
    # `benchmark-intel`, the AWS-only case, is a terminal state that releases
    # this job as well.
    needs: [gate_and_parse, provision, benchmark-intel]
    if: >-
      always() &&
      needs.provision.result != 'success' &&
      needs.provision.result != 'skipped' &&
      contains(needs.gate_and_parse.outputs.runners, 'aws-nvidia-l4')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # The cleanup shell is shared with run-benchmarks.yml; the checkout only
      # fetches it.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Clear runner-ready after an unsuccessful provision
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/clear-stale-runner-ready.sh
